version: '3.8'

services:
  # ── PostgreSQL + PostGIS ───────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hazardmap-db
    environment:
      POSTGRES_USER: hazardmap
      POSTGRES_PASSWORD: hazardmap
      POSTGRES_DB: hazardmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run migrations on first startup
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazardmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── HazardMap API Server ─────────────────────
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: hazardmap-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5001
      NODE_ENV: development
      DATABASE_URL: postgresql://hazardmap:hazardmap@postgres:5432/hazardmap
    ports:
      - "5001:5001"
    # Mount source for development hot-reload
    volumes:
      - ./src:/app/server/src
      - ../src/services/simulationEngine.js:/app/src/services/simulationEngine.js

volumes:
  pgdata:
