[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hazardmap"
version = "0.9.0"
description = "Scientific earthquake and weather hazard simulation platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "HazardMap Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.48.0",
    "pydantic>=2.13.0",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "geopandas>=1.1.0",
    "shapely>=2.1.0",
    "rasterio>=1.4.0",
    "matplotlib>=3.10.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "websockets>=16.0",
    "aiohttp>=3.9.0",
    "geojsoncontour>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  __pycache__
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
