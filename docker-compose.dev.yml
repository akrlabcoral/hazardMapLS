# Development override for HazardMap
# Use this for active development — supports HOT RELOAD (no rebuilds needed!)
# 
# HOW TO USE:
#   1. Stop any running containers first
#   2. Run: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Or create a shortcut: dev-start.bat
#
# WHAT CHANGES:
#   - Frontend uses Vite dev server (with hot reload)
#   - Backend code changes auto-reload via uvicorn --reload
#   - Any file save in ./frontend/src is reflected instantly in browser

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - VITE_ML_API_URL=http://backend:8000
      - VITE_SCIENTIFIC_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy

  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - /app/__pycache__
