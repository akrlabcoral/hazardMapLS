version: '3.8'

services:

  # ── Scientific Backend API ──────────────────────────────────────────────────
  # FastAPI app serving scientific GMPE modeling and GIS computations
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hazardmap-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

  # ── ML Earthquake Service ───────────────────────────────────────────────────
  # FastAPI app serving machine learning inference (LightGBM)
  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    container_name: hazardmap-ml-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./backend/ml-service:/app

  # ── React Frontend (Vite) ───────────────────────────────────────────────────
  # Vite development server with HMR and Docker bridge routing
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hazardmap-frontend
    restart: unless-stopped
    depends_on:
      - api
      - ml-service
    ports:
      - "5173:5173"
    environment:
      - VITE_SCIENTIFIC_API_URL=http://hazardmap-api:8000
      - VITE_ML_API_URL=http://hazardmap-ml-service:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
